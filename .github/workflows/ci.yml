name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      live_tests:
        description: Run the credentialed live provider tests
        required: false
        type: boolean
        default: false
      extensions:
        description: Run bundled extension build and transport checks
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      live_tests:
        description: Run the credentialed live provider tests
        required: false
        type: boolean
        default: false
      extensions:
        description: Run bundled extension build and transport checks
        required: false
        type: boolean
        default: false
    secrets:
      DEEPSEEK_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Install WebUI dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet Go packages
        shell: bash
        env:
          RUN_EXTENSION_TESTS: ${{ inputs.extensions }}
        run: |
          if [[ "$RUN_EXTENSION_TESTS" == "true" ]]; then
            packages="$(go list ./...)"
          else
            # The host still needs internal/extension and its contract tests;
            # only the standalone bundled sidecar packages are opt-in.
            packages="$(go list ./... | rg -v '^ki/extensions/')"
          fi
          go vet $packages
      - name: Type-check WebUI
        working-directory: web
        run: bun run typecheck
      - name: Build WebUI
        working-directory: web
        run: bun run build

  go-tests:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go and CLI tests
        shell: bash
        env:
          RUN_EXTENSION_TESTS: ${{ inputs.extensions }}
        run: |
          set -o pipefail
          if [[ "$RUN_EXTENSION_TESTS" == "true" ]]; then
            packages="$(go list ./...)"
          else
            # The host still needs internal/extension and its contract tests;
            # only the standalone bundled sidecar packages are opt-in.
            packages="$(go list ./... | rg -v '^ki/extensions/')"
          fi
          go test -timeout 10m $packages 2>&1 | tee "${RUNNER_TEMP}/go-test.log"
      # Why: a failed job only shows "exit code 1" to anyone without log access,
      # so every failing test is published as an annotation carrying its own
      # output, and the summary keeps the full digest.
      - name: Report Go test failures
        if: failure()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/go-test.log"
          {
            echo '### Failing Go tests'
            echo '```'
            grep -E '^(--- FAIL|FAIL)' "$log" | head -60
            echo '```'
            grep -n -A 30 '^--- FAIL' "$log" | head -300
          } >> "$GITHUB_STEP_SUMMARY"
          grep -n '^--- FAIL' "$log" | head -20 | while IFS=: read -r line rest; do
            body="$(sed -n "${line},$((line + 25))p" "$log" | sed 's/%/%25/g' \
              | awk 'NR > 1 { printf "%s", "%0A" } { printf "%s", $0 }' | head -c 1500)"
            printf '::error title=%s::%s\n' "${rest#--- FAIL: }" "$body"
          done

  extension-rpc:
    name: Extension transport race checks
    if: inputs.extensions == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check concurrent calls, notifications, cancellation and large records
        run: go test -race -timeout 2m ./pkg/extensionrpc

  zvec-native:
    name: Native zvec-grep (${{ matrix.os }})
    if: inputs.extensions == true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    env:
      KI_ZVEC_GREP_RUNTIME: ${{ github.workspace }}/var/extensions/zvec-grep/bin/zvec-grep${{ matrix.suffix }}
      KI_ZVEC_GREP_BUILD_JOBS: "4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install native Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev g++
      - name: Locate macOS libclang
        if: runner.os == 'macOS'
        shell: bash
        run: echo "LIBCLANG_PATH=$(dirname "$(xcrun --find clang)")/../lib" >> "$GITHUB_ENV"
      - name: Locate Windows libclang
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - name: Install the pinned native Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            extensions/zvec-grep/target
            extensions/zvec-grep/native/target
          key: ${{ runner.os }}-zvec-rust-1.98-${{ hashFiles('extensions/zvec-grep/**/Cargo.lock') }}
      - name: Build the source-free native package
        run: go run ./scripts/build-extensions.go -only zvec-grep -goos ${{ matrix.goos }} -goarch ${{ matrix.goarch }}
      - name: Run native and launcher unit tests
        run: node extensions/zvec-grep/test/native.mjs
      - name: Run the complete original protocol suite and genuine index lifecycle
        shell: bash
        env:
          KI_ZVEC_GREP_LIVE: "1"
        run: node --test extensions/zvec-grep/test/*.test.mjs
      - name: Check native RPC launch and missing-binary installation
        env:
          KI_ZVEC_GREP_INSTALL: "1"
        run: go test -timeout 10m ./internal/extension -run '^TestBundledRust(BinaryWithoutSource|MissingBinaryInstall)$'
      - uses: actions/upload-artifact@v4
        with:
          name: native-zvec-grep-${{ matrix.goos }}-${{ matrix.goarch }}
          path: var/extensions/zvec-grep
          if-no-files-found: error
          retention-days: 1

  web-e2e:
    name: WebUI E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Install WebUI dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: bun x playwright install --with-deps chromium
      - name: Run complete fake-model suite
        working-directory: web
        shell: bash
        env:
          KI_E2E_JOBS: "4"
        run: |
          set -o pipefail
          bun run test 2>&1 | tee e2e-run.log
      - name: Report e2e failures
        if: failure()
        working-directory: web
        shell: bash
        run: |
          set +e
          {
            echo '### e2e failure digest'
            echo '```'
            grep -n -A 14 'Error:' e2e-run.log 2>/dev/null | head -120
            echo '```'
            echo '### e2e run tail'
            echo '```'
            tail -120 e2e-run.log 2>/dev/null
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          digest="$(grep -n -A 14 'Error:' e2e-run.log 2>/dev/null | head -100)"
          printf '::error title=e2e failure digest::%s\n' "$(printf '%s' "$digest" | sed 's/%/%25/g' | awk 'NR > 1 { printf "%s", "%0A" } { printf "%s", $0 }' | head -c 4000)"
          # The DOM snapshot Playwright writes next to a failure shows which
          # session and composer state the page was in.
          for ctx in test-results/runs/*/*/error-context.md; do
            [ -f "$ctx" ] || continue
            body="$(head -c 2000 "$ctx" | sed 's/%/%25/g' | awk 'NR > 1 { printf "%s", "%0A" } { printf "%s", $0 }')"
            printf '::error title=page snapshot %s::%s\n' "${ctx##*/runs/}" "$body"
            break
          done
          for f in test-results/e2e-parallel/run-*/unit-*.log; do
            grep -q 'Error:' "$f" 2>/dev/null || continue
            unit="$(grep -m1 -E '^  [0-9]+\) ' "$f" 2>/dev/null | sed -E 's/^  [0-9]+\) \[[^]]+\] › //; s/[[:space:]]+$//')"
            [ -n "$unit" ] || unit="$f"
            body="$(awk '/^ *Error:/ { capture = 1 } capture { print } /^ *at / { if (capture) exit }' "$f" 2>/dev/null \
              | sed 's/%/%25/g' | awk 'NR > 1 { printf "%s", "%0A" } { printf "%s", $0 }' | head -c 1500)"
            printf '::error title=%s::%s\n' "$unit" "$body"
          done
          exit 0
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-failure
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

  web-extra:
    name: WebUI ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: [perf, shots]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Install WebUI dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: bun x playwright install --with-deps chromium
      - name: Run ${{ matrix.suite }} suite
        working-directory: web
        run: bun run test:${{ matrix.suite }}
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.suite }}-artifacts
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

  # Opt-in only: these need a provider credential, so they never gate a pull
  # request, a push, or a release.
  live-tests:
    name: Live provider tests
    if: inputs.live_tests == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Require the live provider credential
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: test -n "$DEEPSEEK_API_KEY"
      - name: Install WebUI dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: bun x playwright install --with-deps chromium
      - name: Build WebUI
        working-directory: web
        run: bun run build
      - name: Run live protocol adapter tests
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: go test -tags live -timeout 10m ./internal/provider -run '^TestLiveDeepSeek'
      - name: Run live CLI and WebUI tests
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: go test -tags live -timeout 10m ./e2e -run '^TestLive'
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-tests-failure
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
