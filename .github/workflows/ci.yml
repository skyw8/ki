name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
    inputs:
      release_gate:
        description: Run credentialed live tests required for a release
        required: false
        type: boolean
        default: false
    secrets:
      DASHSCOPE_CN_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Install WebUI dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet Go packages
        run: go vet ./...
      - name: Type-check WebUI
        working-directory: web
        run: bun x tsc --noEmit
      - name: Build WebUI
        working-directory: web
        run: bun run build

  go-tests:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go and CLI tests
        run: go test -timeout 10m ./...

  web-e2e:
    name: WebUI E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Install WebUI dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: bun x playwright install --with-deps chromium
      - name: Run complete fake-model suite
        working-directory: web
        env:
          KI_E2E_JOBS: "4"
        run: bun run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-failure
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

  web-extra:
    name: WebUI ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: [perf, shots]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Install WebUI dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: bun x playwright install --with-deps chromium
      - name: Run ${{ matrix.suite }} suite
        working-directory: web
        run: bun run test:${{ matrix.suite }}
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.suite }}-artifacts
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

  live-tests:
    name: Live provider tests
    if: inputs.release_gate == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Require release test credential
        env:
          DASHSCOPE_CN_API_KEY: ${{ secrets.DASHSCOPE_CN_API_KEY }}
        run: test -n "$DASHSCOPE_CN_API_KEY"
      - name: Install WebUI dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: bun x playwright install --with-deps chromium
      - name: Build WebUI
        working-directory: web
        run: bun run build
      - name: Run live CLI and WebUI tests
        env:
          DASHSCOPE_CN_API_KEY: ${{ secrets.DASHSCOPE_CN_API_KEY }}
        run: go test -tags live -timeout 10m ./e2e -run '^TestLive'
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-tests-failure
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
