name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
    inputs:
      release_gate:
        description: Run credentialed live tests required for a release
        required: false
        type: boolean
        default: false
    secrets:
      DASHSCOPE_CN_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Install WebUI dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet Go packages
        run: go vet ./...
      - name: Type-check WebUI
        working-directory: web
        run: bun x tsc --noEmit
      - name: Build WebUI
        working-directory: web
        run: bun run build

  go-tests:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go and CLI tests
        shell: bash
        run: |
          set -o pipefail
          go test -timeout 10m ./... 2>&1 | tee "${RUNNER_TEMP}/go-test.log"
      # Why: a failed job only shows "exit code 1" to anyone without log access,
      # so every failing test is published as an annotation carrying its own
      # output, and the summary keeps the full digest.
      - name: Report Go test failures
        if: failure()
        shell: bash
        run: |
          log="${RUNNER_TEMP}/go-test.log"
          {
            echo '### Failing Go tests'
            echo '```'
            grep -E '^(--- FAIL|FAIL)' "$log" | head -60
            echo '```'
            grep -n -A 30 '^--- FAIL' "$log" | head -300
          } >> "$GITHUB_STEP_SUMMARY"
          grep -n '^--- FAIL' "$log" | head -20 | while IFS=: read -r line rest; do
            body="$(sed -n "${line},$((line + 25))p" "$log" | sed 's/%/%25/g' \
              | awk 'NR > 1 { printf "%s", "%0A" } { printf "%s", $0 }' | head -c 1500)"
            printf '::error title=%s::%s\n' "${rest#--- FAIL: }" "$body"
          done

  web-e2e:
    name: WebUI E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Install WebUI dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: bun x playwright install --with-deps chromium
      - name: Run complete fake-model suite
        working-directory: web
        shell: bash
        env:
          KI_E2E_JOBS: "4"
        run: |
          set -o pipefail
          bun run test:e2e 2>&1 | tee e2e-run.log
      - name: Report e2e failures
        if: failure()
        working-directory: web
        shell: bash
        run: |
          {
            echo '### e2e run tail'
            echo '```'
            tail -80 e2e-run.log
            echo '```'
            for f in test-results/e2e-parallel/unit-*.log; do
              if grep -q 'Error:' "$f"; then
                echo "#### $f"
                echo '```'
                grep -m1 -A 25 'Error:' "$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for f in test-results/e2e-parallel/unit-*.log; do
            grep -q 'Error:' "$f" || continue
            unit="$(grep -m1 -E '^  [0-9]+\) ' "$f" | sed -E 's/^  [0-9]+\) \[[^]]+\] › //; s/[[:space:]]+$//')"
            [ -n "$unit" ] || unit="$f"
            body="$(awk '/^ *Error:/ { capture = 1 } capture { print } /^ *at / { if (capture) exit }' "$f" \
              | sed 's/%/%25/g' | awk 'NR > 1 { printf "%s", "%0A" } { printf "%s", $0 }' | head -c 1500)"
            printf '::error title=%s::%s\n' "$unit" "$body"
          done
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-failure
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

  web-extra:
    name: WebUI ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: [perf, shots]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Install WebUI dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: bun x playwright install --with-deps chromium
      - name: Run ${{ matrix.suite }} suite
        working-directory: web
        run: bun run test:${{ matrix.suite }}
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.suite }}-artifacts
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

  live-tests:
    name: Live provider tests
    if: inputs.release_gate == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Require release test credential
        env:
          DASHSCOPE_CN_API_KEY: ${{ secrets.DASHSCOPE_CN_API_KEY }}
        run: test -n "$DASHSCOPE_CN_API_KEY"
      - name: Install WebUI dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: bun x playwright install --with-deps chromium
      - name: Build WebUI
        working-directory: web
        run: bun run build
      - name: Run live CLI and WebUI tests
        env:
          DASHSCOPE_CN_API_KEY: ${{ secrets.DASHSCOPE_CN_API_KEY }}
        run: go test -tags live -timeout 10m ./e2e -run '^TestLive'
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-tests-failure
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
