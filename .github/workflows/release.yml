name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tests:
    name: All tests
    uses: ./.github/workflows/ci.yml
    with:
      live_tests: false
      # Extensions are distributed separately from the ki executable and are
      # intentionally not part of the default release gate.
      extensions: false

  web:
    name: Build WebUI
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: web
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must be semantic versions such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
      - name: Build and archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          ARCHIVE: ${{ matrix.archive }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="ki-${version}-${GOOS}-${GOARCH}"
          binary="ki"
          if [[ "$GOOS" == "windows" ]]; then binary="ki.exe"; fi

          mkdir -p "package/$package" dist
          go build -trimpath -tags embed \
            -ldflags="-s -w -X ki/internal/buildinfo.Version=${version} -X ki/internal/buildinfo.ReleaseTag=${GITHUB_REF_NAME}" \
            -o "package/$package/$binary" ./cmd/ki
          cp README.md LICENSE "package/$package/"

          if [[ "$ARCHIVE" == "zip" ]]; then
            (cd package && zip -9 -r "../dist/$package.zip" "$package")
          else
            tar -C package -czf "dist/$package.tar.gz" "$package"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ki-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # Extension packages are separate assets: `ki` downloads and verifies them on
  # demand from the WebUI instead of embedding them in the binary. Every
  # supported target builds its own set, and the installer derives the asset
  # name from GOOS/GOARCH.
  extension-assets:
    name: Extension assets ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: tests
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build extension zips
        run: go run ./scripts/build-extensions.go -zip -out var/release-extensions
      - uses: actions/upload-artifact@v4
        with:
          name: extensions-${{ matrix.goos }}-${{ matrix.goarch }}
          path: var/release-extensions/*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [binaries, extension-assets]
    # Why not a plain `needs` gate: a single extension package that fails to
    # build must not withhold the ki binaries. Publish only requires the
    # binaries to have been built; a missing extension family simply means the
    # installer reports that no asset exists for this release until the job is
    # re-run.
    if: always() && needs.binaries.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release works inside a repository: it reads the pushed tag and walks
      # the history for --generate-notes, so this job needs the checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ki-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: extensions-*
          path: release-assets
          merge-multiple: true
        # A platform that failed to build its packages must not block the ki
        # binaries; checksums.txt then simply has no zip for it, and the
        # installer reports a missing asset instead of unpacking a bad one.
        continue-on-error: true
      - name: Write checksums
        working-directory: release-assets
        shell: bash
        # Why both families: `ki` verifies its own archives against this file,
        # and the extension installer looks up <name>-<goos>-<goarch>.zip in the
        # same document before unpacking anything. The Windows binary archive is
        # a .zip too, so it matches both globs; dedupe or checksums.txt would
        # list it twice.
        run: |
          shopt -s nullglob
          declare -A seen=()
          files=()
          for file in ki-* *.zip; do
            [[ -n "${seen[$file]:-}" ]] && continue
            seen[$file]=1
            files+=("$file")
          done
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no release assets to hash"
            exit 1
          fi
          sha256sum "${files[@]}" > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "Ki $GITHUB_REF_NAME" \
            --generate-notes
