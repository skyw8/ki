<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Ki TV robot</title>
  <desc id="desc">A light-blue television robot with two antennae and a smiling screen face.</desc>
  <defs>
    <linearGradient id="body" x1="64" y1="32" x2="64" y2="114" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45c9f2"/>
      <stop offset="1" stop-color="#1797d2"/>
    </linearGradient>
    <linearGradient id="screen" x1="64" y1="46" x2="64" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2f6ff"/>
    </linearGradient>
  </defs>
  <!-- antennae -->
  <g fill="none" stroke="#23ade5" stroke-width="8" stroke-linecap="round">
    <path d="M46 38 L33 17"/>
    <path d="M82 38 L95 17"/>
  </g>
  <circle cx="30" cy="13" r="8" fill="#23ade5"/>
  <circle cx="98" cy="13" r="8" fill="#23ade5"/>
  <!-- body -->
  <rect x="12" y="32" width="104" height="82" rx="24" fill="url(#body)"/>
  <!-- screen -->
  <rect x="26" y="46" width="76" height="54" rx="16" fill="url(#screen)"/>
  <!-- eyes -->
  <g fill="#0f4d70">
    <rect x="44" y="60" width="13" height="22" rx="6.5"/>
    <rect x="71" y="60" width="13" height="22" rx="6.5"/>
  </g>
  <!-- smile -->
  <path d="M55 88 q9 8 18 0" fill="none" stroke="#0f4d70" stroke-width="6" stroke-linecap="round"/>
</svg>
